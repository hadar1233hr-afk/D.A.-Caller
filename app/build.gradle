plugins { id 'com.android.application' }
def permanentStorePath=System.getenv('DA_CALLER_KEYSTORE_PATH')
def permanentPassword=System.getenv('DA_CALLER_KEYSTORE_PASSWORD')
if((permanentStorePath as boolean) != (permanentPassword as boolean)){
 throw new GradleException('DA CALLER signing identity is incomplete; no fallback to another key is allowed.')
}
android {
 namespace 'com.dacaller.app'
 compileSdk 35
 defaultConfig {
  applicationId 'com.dacaller.app'
  minSdk 26
  targetSdk 34
  versionCode 22
  versionName '0.13.0'
  buildConfigField 'boolean', 'BUSINESS_DIRECTORY_ENABLED', 'true'
  testInstrumentationRunner 'android.test.InstrumentationTestRunner'
 }
 signingConfigs {
  permanent {
   if(permanentStorePath && permanentPassword){
    storeFile file(permanentStorePath)
    storePassword permanentPassword
    keyAlias 'da-caller'
    keyPassword permanentPassword
    storeType 'jks'
   }
  }
 }
 buildFeatures { buildConfig true }
 buildTypes {
  debug {
   // CI supplies the existing verified key BEFORE building the emulator APK.
   // Without it this variant is disposable test-only and publication is blocked.
   if(permanentStorePath && permanentPassword) signingConfig signingConfigs.permanent
  }
  release {
   minifyEnabled false
   if(permanentStorePath && permanentPassword) signingConfig signingConfigs.permanent
  }
 }
 testOptions {
  unitTests.includeAndroidResources = true
 }
 lint {
  abortOnError true
  warningsAsErrors false
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
}


dependencies {
 // Platform instrumentation APIs are compile-only and never enter the production APK.
 androidTestCompileOnly fileTree(dir: "${android.sdkDirectory}/platforms/android-35/optional", include: ['android.test.base.jar', 'android.test.runner.jar', 'android.test.mock.jar'])
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 testImplementation 'org.mockito:mockito-core:5.14.2'
}
