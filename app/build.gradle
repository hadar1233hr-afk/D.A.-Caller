plugins { id 'com.android.application' }
android {
 namespace 'com.dacaller.app'
 compileSdk 35
 defaultConfig {
  applicationId 'com.dacaller.app'
  minSdk 26
  targetSdk 34
  versionCode 8
  versionName '0.8.0'
 }
 signingConfigs {
  permanent {
   def storePath=System.getenv('DA_CALLER_KEYSTORE_PATH')
   def password=System.getenv('DA_CALLER_KEYSTORE_PASSWORD')
   if(storePath && password){
    storeFile file(storePath)
    storePassword password
    keyAlias 'da-caller'
    keyPassword password
    storeType 'jks'
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   def path=System.getenv('DA_CALLER_KEYSTORE_PATH')
   def pass=System.getenv('DA_CALLER_KEYSTORE_PASSWORD')
   if(path && pass) signingConfig signingConfigs.permanent
  }
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
}
