plugins { id 'com.android.application' }
android {
 namespace 'com.dacaller.app'
 compileSdk 35
 defaultConfig {
  applicationId 'com.dacaller.app'
  minSdk 26
  targetSdk 34
  versionCode 16
  versionName '0.11.0-beta.6'
  testInstrumentationRunner 'android.test.InstrumentationTestRunner'
 }
 signingConfigs {
  permanent {
   def storePath=System.getenv('DA_CALLER_KEYSTORE_PATH')
   def password=System.getenv('DA_CALLER_KEYSTORE_PASSWORD')
   if(storePath && password){
    storeFile file(storePath)
    storePassword password
    keyAlias 'da-caller'
    keyPassword password
    storeType 'jks'
   }
  }
 }
 buildFeatures { buildConfig true }
 buildTypes {
  release {
   minifyEnabled false
   def path=System.getenv('DA_CALLER_KEYSTORE_PATH')
   def pass=System.getenv('DA_CALLER_KEYSTORE_PASSWORD')
   if(path && pass) signingConfig signingConfigs.permanent
  }
 }
 testOptions {
  unitTests.includeAndroidResources = true
 }
 lint {
  abortOnError true
  warningsAsErrors false
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
}


dependencies {
 // Platform instrumentation APIs are compile-only and never enter the production APK.
 androidTestCompileOnly fileTree(dir: "${android.sdkDirectory}/platforms/android-35/optional", include: ['android.test.base.jar', 'android.test.runner.jar', 'android.test.mock.jar'])
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 testImplementation 'org.mockito:mockito-core:5.14.2'
}
