name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DA-CALLER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DA-CALLER-v0.1.0.apk
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 DA-CALLER-v0.1.0.apk --clobber
          else
            gh release create v0.1.0 DA-CALLER-v0.1.0.apk --title 'DA CALLER v0.1.0' --notes 'Prototype debug-signed APK'
          fi
