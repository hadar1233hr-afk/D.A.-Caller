name: Validate DA CALLER
on:
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/android.yml'
      - 'scripts/run-android-ui.sh'
      - 'scripts/verify-ui-matrix.py'
      - 'scripts/verify-personalization-matrix.py'
      - 'scripts/verify-call-integration-matrix.py'
      - 'scripts/verify-island-matrix.py'
      - 'scripts/emulator-call-driver.py'
      - 'scripts/verify-external-island-matrix.py'
      - 'scripts/verify-followup-matrix.py'
      - 'scripts/verify-visual-review.py'
      - 'scripts/da_caller_signing.py'
      - 'scripts/da_caller_ci_signing.py'
      - 'scripts/tests/test_da_caller*.py'
      - 'scripts/business-directory/**'
      - 'scripts/verify-callback-business-matrix.py'
      - 'docs/evidence/callback-business-2026-11-04/**'
      - 'docs/DA_CALLER_SIGNING_POLICY.json'
      - 'docs/evidence/2026-10-25/**'
      - 'docs/evidence/personalization-2026-10-25/**'
      - 'docs/evidence/island-2026-10-27/**'
      - 'docs/evidence/external-island-2026-10-28/**'
      - 'docs/evidence/call-followup-2026-11-01/**'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/android.yml'
      - 'scripts/run-android-ui.sh'
      - 'scripts/verify-ui-matrix.py'
      - 'scripts/verify-personalization-matrix.py'
      - 'scripts/verify-call-integration-matrix.py'
      - 'scripts/verify-island-matrix.py'
      - 'scripts/emulator-call-driver.py'
      - 'scripts/verify-external-island-matrix.py'
      - 'scripts/verify-followup-matrix.py'
      - 'scripts/verify-visual-review.py'
      - 'scripts/da_caller_signing.py'
      - 'scripts/da_caller_ci_signing.py'
      - 'scripts/tests/test_da_caller*.py'
      - 'scripts/business-directory/**'
      - 'scripts/verify-callback-business-matrix.py'
      - 'docs/evidence/callback-business-2026-11-04/**'
      - 'docs/DA_CALLER_SIGNING_POLICY.json'
  workflow_dispatch:
    inputs:
      publish_beta:
        description: 'Publish a NEW prerelease after validation (main branch only)'
        type: boolean
        default: false
      device_verified:
        description: 'Android 13 physical-device telephony checklist passed for this commit'
        type: boolean
        default: false
concurrency:
  group: da-caller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish exactly the source SHA that validation and screenshots used.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare existing signing identity before building (never generate a key)
        id: signing
        env:
          DA_CALLER_KEYSTORE_BASE64: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.DA_CALLER_KEYSTORE_BASE64 || '' }}
          DA_CALLER_KEYSTORE_PASSWORD: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.DA_CALLER_KEYSTORE_PASSWORD || '' }}
          DA_CALLER_CERT_SHA256: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.DA_CALLER_CERT_SHA256 || '' }}
        run: python3 scripts/da_caller_ci_signing.py prepare --directory "$RUNNER_TEMP/da-caller-signing" --report app/build/signing-context.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/business-directory/requirements-lock.txt
      - name: Install locked business-data tooling dependencies
        run: python3 -m pip install -r scripts/business-directory/requirements-lock.txt
      - name: Verify all DA CALLER Python tooling contracts
        run: |
          set -euo pipefail
          mkdir -p app/build/tooling-checks
          python3 -m unittest discover -s scripts/tests -p 'test_da_caller*.py' -v 2>&1 | tee app/build/tooling-checks/signing-tests.txt
      - name: Verify business extraction and packaging contracts (synthetic test inputs only)
        run: |
          set -euo pipefail
          mkdir -p app/build/tooling-checks
          python3 -m unittest discover -s scripts/business-directory -p 'test_*.py' -v 2>&1 | tee app/build/tooling-checks/business-data-tests.txt
      - name: Build, test and lint DA CALLER only
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify APK identity, version and signature
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee app/build/debug-signature.txt
          "$TOOLS/aapt" dump badging "$APK" > app/build/apk-metadata.txt
          python3 - <<'PY'
          import os, re, zipfile
          from pathlib import Path
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              for name in apk.namelist():
                  if re.fullmatch(r'classes[0-9]*\.dex', name):
                      dex = apk.read(name)
                      assert b'Lcom/dabusinessbook/' not in dex and b'Lcom/dacaller/offline/' not in dex, 'Separate app code included'
          metadata = Path('app/build/apk-metadata.txt').read_text()
          assert "package: name='com.dacaller.app'" in metadata, 'Wrong Android product'
          assert "sdkVersion:'26'" in metadata, 'Unexpected minimum Android API'
          assert "android.permission.INTERNET" not in metadata, 'DA CALLER must remain offline'
          assert "android.permission.SYSTEM_ALERT_WINDOW" in metadata, 'Optional outside-app call island permission missing'
          version = re.search(r"versionName='([^']+)'", metadata).group(1)
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.]+)?', version), 'Unsafe version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PY
          sha256sum "$APK" > app/build/debug-apk.sha256
          python3 scripts/da_caller_ci_signing.py verify-apk --apk "$APK" --context app/build/signing-context.json --report app/build/debug-signing-policy.json --apksigner "$TOOLS/apksigner"
      - uses: actions/upload-artifact@v4
        with:
          name: DA-CALLER-${{ steps.metadata.outputs.version }}-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/debug-signature.txt
            app/build/debug-signing-policy.json
            app/build/debug-apk.sha256
            app/build/apk-metadata.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DA-CALLER-checks-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            app/build/tooling-checks/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary private signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/da-caller-signing"

  android-ui:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish exactly the source SHA that validation and screenshots used.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare existing signing identity before building (never generate a key)
        id: signing
        env:
          DA_CALLER_KEYSTORE_BASE64: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.DA_CALLER_KEYSTORE_BASE64 || '' }}
          DA_CALLER_KEYSTORE_PASSWORD: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.DA_CALLER_KEYSTORE_PASSWORD || '' }}
          DA_CALLER_CERT_SHA256: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.DA_CALLER_CERT_SHA256 || '' }}
        run: python3 scripts/da_caller_ci_signing.py prepare --directory "$RUNNER_TEMP/da-caller-signing" --report app/build/signing-context.json
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 13 visual matrix and interaction regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          # Pin test userdata size: the current API33 image otherwise requests
          # >7GB while this disposable runner may have only6GB free.
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -prop qemu.hw.mainkeys=0
          # This action executes each input line in a separate shell.
          script: bash scripts/run-android-ui.sh
      - name: Verify the exact APK installed by the emulator test task
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p app/build/native-tested
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > app/build/native-tested/debug-signature.txt
          "$TOOLS/aapt" dump badging "$APK" > app/build/native-tested/apk-metadata.txt
          sha256sum "$APK" > app/build/native-tested/debug-apk.sha256
          python3 - <<'PY'
          import re, zipfile
          from pathlib import Path
          metadata = Path('app/build/native-tested/apk-metadata.txt').read_text()
          assert "package: name='com.dacaller.app'" in metadata
          assert "sdkVersion:'26'" in metadata and "android.permission.INTERNET" not in metadata
          assert "android.permission.SYSTEM_ALERT_WINDOW" in metadata
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              for name in apk.namelist():
                  if re.fullmatch(r'classes[0-9]*\.dex', name):
                      dex = apk.read(name)
                      assert b'Lcom/dabusinessbook/' not in dex and b'Lcom/dacaller/offline/' not in dex
                      assert b'Lcom/dacaller/app/BackupDocumentProvider;' not in dex
          PY
          python3 scripts/da_caller_ci_signing.py verify-apk --apk "$APK" --context app/build/signing-context.json --report app/build/native-tested/debug-signing-policy.json --apksigner "$TOOLS/apksigner"
      - uses: actions/upload-artifact@v4
        with:
          name: DA-CALLER-${{ needs.validate.outputs.version }}-tested-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/native-tested/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DA-CALLER-Android13-UI-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/ui-snapshots/
            app/build/ui-device-config.txt
            app/build/emulator-call-driver.*
          if-no-files-found: warn
          retention-days: 30

      - name: Retain built APK as an unapproved candidate after a native failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then exit 0; fi
          mkdir -p app/build/native-failure-candidate
          cp "$APK" app/build/native-failure-candidate/app-debug.apk
          sha256sum "$APK" > app/build/native-failure-candidate/debug-apk.sha256
          printf '%s\n' 'NOT APPROVED: native suite failed or was incomplete. This is diagnostic evidence only; not a release or verified update.' > app/build/native-failure-candidate/NOT-APPROVED.txt
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > app/build/native-failure-candidate/debug-signature.txt
          "$TOOLS/aapt" dump badging "$APK" > app/build/native-failure-candidate/apk-metadata.txt
          if [ -f app/build/signing-context.json ]; then
            python3 scripts/da_caller_ci_signing.py verify-apk --apk "$APK" --context app/build/signing-context.json --report app/build/native-failure-candidate/debug-signing-policy.json --apksigner "$TOOLS/apksigner"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: DA-CALLER-native-failure-candidate-${{ github.sha }}
          path: app/build/native-failure-candidate/
          if-no-files-found: warn
          retention-days: 30
      - name: Remove temporary private signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/da-caller-signing"

  # A push cannot publish or replace a release. This main-only operator job
  # requires an explicitly verified main commit, a permanent key and its pinned
  # certificate fingerprint. Configure the da-caller-release environment to
  # require a reviewer. Signing inputs are repository secrets so the SAME key
  # is available before both validation jobs; no key enters a publication job.
  beta:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_beta && inputs.device_verified
    needs: [validate, android-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: da-caller-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish exactly the source SHA that validation and screenshots used.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install signature-verification tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Require visual review of this exact application source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DA_CALLER_VISUAL_REVIEW: docs/evidence/callback-business-2026-11-04/visual-review.json
        run: python3 scripts/verify-visual-review.py
      - uses: actions/download-artifact@v4
        with:
          name: DA-CALLER-${{ needs.validate.outputs.version }}-tested-debug-${{ github.sha }}
          path: candidate
      - name: Verify compatible permanent signer and reuse exact native-tested APK
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find candidate -name app-debug.apk -type f -print -quit)
          CONTEXT=$(find candidate -name debug-signing-policy.json -type f -print -quit)
          test -n "$APK"
          test -n "$CONTEXT"
          python3 scripts/da_caller_ci_signing.py verify-apk --publication --apk "$APK" --context "$CONTEXT" --report publication-signing.json --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          cp "$APK" "DA-CALLER-v$VERSION.apk"
          sha256sum "DA-CALLER-v$VERSION.apk" > "DA-CALLER-v$VERSION.apk.sha256"
      - name: Publish immutable beta
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Existing tags/releases are an error. No --clobber or force updates.
          EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/v$VERSION")
          if [ -n "$EXISTING_TAG" ]; then
            echo 'Version tag already exists; choose a new version.' >&2
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; choose a new version.' >&2
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          DA CALLER beta. This is the exact permanent-signed DEBUG binary tested
          by the Android 13 emulator job; no publication-time rebuild occurs.
          The source passed unit tests, lint, package/signature checks and its
          recorded visual review. Publication additionally requires the pinned
          signer to match the required existing installation's certificate.
          This workflow does not perform physical-device telephony tests.
          SIM/audio/Bluetooth/Jelly Star and a physical in-place update require
          separately recorded hardware evidence. Never uninstall an existing
          installation: doing so deletes its private archive and settings.
          Business Book and DA ID Offline are separate applications.
          NOTES
          gh release create "v$VERSION" "DA-CALLER-v$VERSION.apk" "DA-CALLER-v$VERSION.apk.sha256" publication-signing.json \
            --target "$GITHUB_SHA" --prerelease --title "DA CALLER v$VERSION beta" \
            --notes-file release-notes.md

  # Explicitly marked DEBUG TEST prerelease. Publication now requires a
  # permanent compatible key supplied BEFORE emulator validation; no fallback.
  # Never publishes on forks or changes the separately gated stable-beta process.
  preview-debug:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'codex/da-caller-hardening-20261023' || ((github.event.pull_request.head.ref == 'codex/da-caller-visual-20261025' || github.event.pull_request.head.ref == 'codex/da-caller-personalization-20261025' || github.event.pull_request.head.ref == 'codex/da-caller-dynamic-island-20261027') && contains(github.event.pull_request.labels.*.name, 'visual-reviewed')))
    needs: [validate, android-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install signature-verification tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Require visual review of this exact application source
        if: github.event.pull_request.head.ref == 'codex/da-caller-visual-20261025'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/verify-visual-review.py
      - name: Require review of all eight continuation features for this exact source
        if: github.event.pull_request.head.ref == 'codex/da-caller-personalization-20261025'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DA_CALLER_VISUAL_REVIEW: docs/evidence/personalization-2026-10-25/visual-review.json
        run: python3 scripts/verify-visual-review.py
      - name: Require callback, licensed directory and earlier UI review of this exact source
        if: github.event.pull_request.head.ref == 'codex/da-caller-dynamic-island-20261027'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DA_CALLER_VISUAL_REVIEW: docs/evidence/callback-business-2026-11-04/visual-review.json
        run: python3 scripts/verify-visual-review.py
      - uses: actions/download-artifact@v4
        with:
          # Publish exactly the emulator-tested binary. Its pinned permanent
          # compatible signer is independently checked below; no rebuild.
          name: DA-CALLER-${{ needs.validate.outputs.version }}-tested-debug-${{ github.sha }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: DA-CALLER-Android13-UI-${{ github.sha }}
          path: visual-review
      - name: Publish reviewed debug test prerelease only with a compatible permanent signer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^0[.]11[.]0-beta[.][0-9]+$ ]]
          APK=$(find candidate -name app-debug.apk -type f -print -quit)
          test -n "$APK"
          CONTEXT=$(find candidate -name debug-signing-policy.json -type f -print -quit)
          test -n "$CONTEXT"
          python3 scripts/da_caller_ci_signing.py verify-apk --publication --apk "$APK" --context "$CONTEXT" --report publication-signing.json --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          cp "$APK" "DA-CALLER-v$VERSION-debug.apk"
          sha256sum "DA-CALLER-v$VERSION-debug.apk" > "DA-CALLER-v$VERSION-debug.apk.sha256"
          python3 -m zipfile -c "DA-CALLER-v$VERSION-Android13-screenshots.zip" visual-review
          SIGNATURE=$(find candidate -name debug-signature.txt -type f -print -quit)
          METADATA=$(find candidate -name apk-metadata.txt -type f -print -quit)
          test -n "$SIGNATURE"
          test -n "$METADATA"
          cp "$SIGNATURE" "DA-CALLER-v$VERSION-signature.txt"
          cp "$METADATA" "DA-CALLER-v$VERSION-metadata.txt"
          if gh release view "v$VERSION-debug" >/dev/null 2>&1; then
            echo 'Debug preview already exists; never overwrite a release.' >&2
            exit 0
          fi
          EXISTING_PREVIEW_TAG=$(git ls-remote --tags origin "refs/tags/v$VERSION-debug")
          if [ -n "$EXISTING_PREVIEW_TAG" ]; then
            echo 'Debug preview tag already exists without a release; choose a new version.' >&2
            exit 1
          fi
          cat > preview-notes.md <<'NOTES'
          # DA CALLER — UNVERIFIED DEBUG TEST BUILD
          ## Implemented changes
          - Optional daily callback reminders group today's missed callers and require a later connected call longer than one second; default off with a selectable local time.
          - The reminder reads local providers without changing call history or the archive.
          - A separate offline business tab uses a reviewed licensed dataset, paged search and per-record source details; never private contacts or fabricated records.
          - DA CALLER handles the platform default-dialer missed-call broadcast, with contact identity, grouped counts and direct return to recents.
          - Explicit opening/dismissal acknowledges only the captured missed-call rows; no history/archive rows are deleted.
          - Offline version-by-version changelog in Settings, with Hebrew/English and light/dark/AMOLED support.
          - Apple-inspired call island inside app screens, with compact and expanded controls.
          - Optional call island over Home and other apps, after explicit opt-in and Android display-over-apps special access.
          - Incoming calls keep Android's native CallStyle answer/decline notification; the external island starts for outgoing, active and held calls.
          - External mute, supported speaker routes, return and confirmed end use the currently owned Telecom call.
          - Protected system screens may hide floating windows; the original incoming alert and ongoing call notification remain available.
          - Three island styles, two sizes, optional controls/timer/photo/animation and safe end confirmation.
          - Explicitly labelled interactive demo and portable island settings backup.
          - The in-app island reserves space above content and preserves navigation/list state without special access.
          - External windows are disabled by default, hide inside this app, on permission loss, screen-off, lock and call end.
          - Offline settings backup/restore with a validated file and explicit confirmation.
          - Five selectable original dark-green/gold launcher icons.
          - Collapsible horizontal favorites above contacts and recents, and a compact expandable summary.
          - Circle contact photos by default, with three more shapes shared across screens and widgets.
          - Archived calls resolve current contact names and photos, with name/number search.
          - Native call notifications show contact identity and state, return, hang-up and speaker actions.
          - Back returns from the call screen to the last DA CALLER screen without ending the call.
          - Google Phone-inspired normal, audio, More and DTMF screens in light/dark.
          - Distinct One UI, iOS 26 glass, HyperOS and Nothing-inspired layouts.
          - Icon-only hang-up, capability-aware controls and exact Bluetooth endpoint selection.
