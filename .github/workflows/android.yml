name: Build DA CALLER Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:
concurrency:
  group: da-caller-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK platforms
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          yes | "$SDKM" "platforms;android-35" "build-tools;35.0.0" >/dev/null || test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/platforms/android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore optional permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.DA_CALLER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DA_CALLER_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > app/release.jks
            echo "DA_CALLER_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/release.jks" >> "$GITHUB_ENV"
            echo "DA_CALLER_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "SIGNING_FLAVOR=PERMANENT" >> "$GITHUB_ENV"
          else
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "SIGNING_FLAVOR=TEMPORARY_DEBUG" >> "$GITHUB_ENV"
            echo "::warning::Permanent signing secrets are missing. This APK may require a reinstall."
          fi
      - name: Build Android APK
        run: |
          if [ "$SIGNING_FLAVOR" = "PERMANENT" ]; then
            gradle --no-daemon :app:assembleRelease
          else
            gradle --no-daemon :app:assembleDebug
          fi
      - name: Verify signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH"
          test -s "$APK_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: DA-CALLER-v0.9.0-APK
          path: ${{ env.APK_PATH }}
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$APK_PATH" DA-CALLER-v0.9.0.apk
          if gh release view v0.9.0 >/dev/null 2>&1; then
            gh release upload v0.9.0 DA-CALLER-v0.9.0.apk --clobber
          else
            gh release create v0.9.0 DA-CALLER-v0.9.0.apk \
              --title 'DA CALLER v0.9.0' \
              --notes 'Dialer-only update from current main: improved favorite contact photos, preserved Recents and Contacts scroll position, call controls and notification fixes, archive visibility, expanded bilingual strings, and visual consistency. Business Book is a separate Android module and is not part of this APK. Debug signing may require reinstall unless permanent signing secrets are configured.'
          fi
