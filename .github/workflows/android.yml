name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: da-caller-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK platforms
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          echo "Using $SDKM"
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          yes | "$SDKM" "platforms;android-35" "build-tools;35.0.0" >/dev/null || test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/platforms/android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build main dialer
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signatures
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DA-CALLER-v0.6.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DA-CALLER-v0.6.0.apk
          if gh release view v0.6.0 >/dev/null 2>&1; then
            gh release upload v0.6.0 DA-CALLER-v0.6.0.apk --clobber
          else
            gh release create v0.6.0 DA-CALLER-v0.6.0.apk --title 'DA CALLER v0.6.0' --notes 'Performance-focused dialer beta: persistent UI shell, tappable feedback, compact pages, clear call types and vector icons.'
          fi
