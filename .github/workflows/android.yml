name: Validate DA CALLER
on:
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/android.yml'
      - 'scripts/run-android-ui.sh'
      - 'scripts/verify-ui-matrix.py'
      - 'scripts/verify-personalization-matrix.py'
      - 'scripts/verify-call-integration-matrix.py'
      - 'scripts/verify-visual-review.py'
      - 'docs/evidence/2026-10-25/**'
      - 'docs/evidence/personalization-2026-10-25/**'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/android.yml'
      - 'scripts/run-android-ui.sh'
      - 'scripts/verify-ui-matrix.py'
      - 'scripts/verify-personalization-matrix.py'
      - 'scripts/verify-call-integration-matrix.py'
      - 'scripts/verify-visual-review.py'
  workflow_dispatch:
    inputs:
      publish_beta:
        description: 'Publish a NEW prerelease after validation (main branch only)'
        type: boolean
        default: false
      device_verified:
        description: 'Android 13 physical-device telephony checklist passed for this commit'
        type: boolean
        default: false
concurrency:
  group: da-caller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish exactly the source SHA that validation and screenshots used.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, test and lint DA CALLER only
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify APK identity, version and signature
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee app/build/debug-signature.txt
          "$TOOLS/aapt" dump badging "$APK" > app/build/apk-metadata.txt
          python3 - <<'PY'
          import os, re, zipfile
          from pathlib import Path
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              for name in apk.namelist():
                  if re.fullmatch(r'classes[0-9]*\.dex', name):
                      dex = apk.read(name)
                      assert b'Lcom/dabusinessbook/' not in dex and b'Lcom/dacaller/offline/' not in dex, 'Separate app code included'
          metadata = Path('app/build/apk-metadata.txt').read_text()
          assert "package: name='com.dacaller.app'" in metadata, 'Wrong Android product'
          assert "sdkVersion:'26'" in metadata, 'Unexpected minimum Android API'
          assert "android.permission.INTERNET" not in metadata, 'DA CALLER must remain offline'
          version = re.search(r"versionName='([^']+)'", metadata).group(1)
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.]+)?', version), 'Unsafe version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PY
          sha256sum "$APK" > app/build/debug-apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DA-CALLER-${{ steps.metadata.outputs.version }}-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/debug-signature.txt
            app/build/debug-apk.sha256
            app/build/apk-metadata.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DA-CALLER-checks-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 30

  android-ui:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish exactly the source SHA that validation and screenshots used.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 13 visual matrix and interaction regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -prop qemu.hw.mainkeys=0
          # This action executes each input line in a separate shell.
          script: bash scripts/run-android-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DA-CALLER-Android13-UI-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/ui-snapshots/
            app/build/ui-device-config.txt
          if-no-files-found: warn
          retention-days: 30

  # A push/PR can never publish or replace a release. This separately gated job
  # requires an explicitly verified main commit, a permanent key and its pinned
  # certificate fingerprint. Configure the da-caller-release environment to
  # require a reviewer before supplying signing secrets.
  beta:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_beta && inputs.device_verified
    needs: [validate, android-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: da-caller-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish exactly the source SHA that validation and screenshots used.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify permanent signed beta
        env:
          KEYSTORE_B64: ${{ secrets.DA_CALLER_KEYSTORE_BASE64 }}
          DA_CALLER_KEYSTORE_PASSWORD: ${{ secrets.DA_CALLER_KEYSTORE_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.DA_CALLER_CERT_SHA256 }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$DA_CALLER_KEYSTORE_PASSWORD"
          test -n "$EXPECTED_CERT_SHA256"
          export DA_CALLER_KEYSTORE_PATH="$RUNNER_TEMP/da-caller-release.jks"
          trap 'rm -f "$DA_CALLER_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$DA_CALLER_KEYSTORE_PATH"
          chmod 600 "$DA_CALLER_KEYSTORE_PATH"
          ./gradlew --no-daemon :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > app/build/release-signature.txt
          "$TOOLS/aapt" dump badging "$APK" > app/build/release-metadata.txt
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          normalize = lambda value: value.replace(':', '').strip().lower()
          cert = re.search(r'Signer #1 certificate SHA-256 digest: (\S+)', Path('app/build/release-signature.txt').read_text()).group(1)
          assert normalize(cert) == normalize(os.environ['EXPECTED_CERT_SHA256']), 'Unexpected signing certificate'
          metadata = Path('app/build/release-metadata.txt').read_text()
          assert "package: name='com.dacaller.app'" in metadata
          version = re.search(r"versionName='([^']+)'", metadata).group(1)
          assert version == os.environ['VERSION']
          assert tuple(map(int, version.split('-')[0].split('.'))) > (0, 9, 0), 'Never replace 0.8.0/0.9.0'
          PY
          cp "$APK" "DA-CALLER-v$VERSION.apk"
          sha256sum "DA-CALLER-v$VERSION.apk" > "DA-CALLER-v$VERSION.apk.sha256"
      - name: Publish immutable beta
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Existing tags/releases are an error. No --clobber or force updates.
          EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/v$VERSION")
          if [ -n "$EXISTING_TAG" ]; then
            echo 'Version tag already exists; choose a new version.' >&2
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; choose a new version.' >&2
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          DA CALLER beta. Built from the linked verified commit, with unit tests,
          lint, package identity and permanent certificate checks. The operator
          confirmed the Android 13 physical-device checklist for this commit.
          Business Book and DA ID Offline are separate applications.
          NOTES
          gh release create "v$VERSION" "DA-CALLER-v$VERSION.apk" "DA-CALLER-v$VERSION.apk.sha256" \
            --target "$GITHUB_SHA" --prerelease --title "DA CALLER v$VERSION beta" \
            --notes-file release-notes.md

  # Explicitly marked TEST prerelease. It does NOT claim field validation or
  # use permanent signing and cannot update a differently signed install.
  # Never publishes on forks or changes the separately gated stable-beta process.
  preview-debug:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.head.ref == 'codex/da-caller-hardening-20261023' || ((github.event.pull_request.head.ref == 'codex/da-caller-visual-20261025' || github.event.pull_request.head.ref == 'codex/da-caller-personalization-20261025') && contains(github.event.pull_request.labels.*.name, 'visual-reviewed')))
    needs: [validate, android-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require visual review of this exact application source
        if: github.event.pull_request.head.ref == 'codex/da-caller-visual-20261025'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/verify-visual-review.py
      - name: Require review of all eight continuation features for this exact source
        if: github.event.pull_request.head.ref == 'codex/da-caller-personalization-20261025'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DA_CALLER_VISUAL_REVIEW: docs/evidence/personalization-2026-10-25/visual-review.json
        run: python3 scripts/verify-visual-review.py
      - uses: actions/download-artifact@v4
        with:
          name: DA-CALLER-${{ needs.validate.outputs.version }}-debug-${{ github.sha }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: DA-CALLER-Android13-UI-${{ github.sha }}
          path: visual-review
      - name: Publish explicitly unverified debug prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^0[.]11[.]0-beta[.][0-9]+$ ]]
          APK=$(find candidate -name app-debug.apk -type f -print -quit)
          test -n "$APK"
          cp "$APK" "DA-CALLER-v$VERSION-debug.apk"
          sha256sum "DA-CALLER-v$VERSION-debug.apk" > "DA-CALLER-v$VERSION-debug.apk.sha256"
          python3 -m zipfile -c "DA-CALLER-v$VERSION-Android13-screenshots.zip" visual-review
          SIGNATURE=$(find candidate -name debug-signature.txt -type f -print -quit)
          METADATA=$(find candidate -name apk-metadata.txt -type f -print -quit)
          test -n "$SIGNATURE"
          test -n "$METADATA"
          cp "$SIGNATURE" "DA-CALLER-v$VERSION-signature.txt"
          cp "$METADATA" "DA-CALLER-v$VERSION-metadata.txt"
          if gh release view "v$VERSION-debug" >/dev/null 2>&1; then
            echo 'Debug preview already exists; never overwrite a release.' >&2
            exit 0
          fi
          EXISTING_PREVIEW_TAG=$(git ls-remote --tags origin "refs/tags/v$VERSION-debug")
          if [ -n "$EXISTING_PREVIEW_TAG" ]; then
            echo 'Debug preview tag already exists without a release; choose a new version.' >&2
            exit 1
          fi
          cat > preview-notes.md <<'NOTES'
          # DA CALLER — UNVERIFIED DEBUG TEST BUILD
          ## Implemented changes
          - Offline settings backup/restore with a validated file and explicit confirmation.
          - Five selectable original dark-green/gold launcher icons.
          - Collapsible horizontal favorites above contacts and recents, and a compact expandable summary.
          - Circle contact photos by default, with three more shapes shared across screens and widgets.
          - Archived calls resolve current contact names and photos, with name/number search.
          - Native call notifications show contact identity and state, return, hang-up and speaker actions.
          - Back returns from the call screen to the last DA CALLER screen without ending the call.
          - Google Phone-inspired normal, audio, More and DTMF screens in light/dark.
          - Distinct One UI, iOS 26 glass, HyperOS and Nothing-inspired layouts.
          - Icon-only hang-up, capability-aware controls and exact Bluetooth endpoint selection.
          - Compact quick/contact widgets and four/five independently callable favorites.
          - Stable contact return position and live permission/phone-integration settings.

          ## Verification and installation limits
          The linked source passed unit tests, lint, APK verification and the
          Android 13 emulator suite at 480x854/240dpi with native three-button
          navigation, RTL, font1.3 and 122 required PNG captures. The exact app
          tree and the additional personalization captures were visually reviewed
          before publication; see the linked pull request and its verification report.
          This is **not** a stable or device-verified release.
          The Android build, unit tests and emulator UI checks passed, but
          actual cellular calls, answering, ringing, lock screen, SIM and
          Unihertz Jelly Star behavior have NOT been verified on hardware.
          It is signed with an ephemeral CI debug certificate and cannot
          update any differently signed installation in place, including
          earlier 0.11 betas. **Do not uninstall your existing installation:
          uninstalling deletes its private archive and settings.** A matching
          secure signing key is required for a guaranteed data-preserving update.
          Keep a working alternative dialer installed. Test on a spare device.
          No APK in this preview should be considered production ready.
          NOTES
          gh release create "v$VERSION-debug" "DA-CALLER-v$VERSION-debug.apk" "DA-CALLER-v$VERSION-debug.apk.sha256" \
            "DA-CALLER-v$VERSION-Android13-screenshots.zip" "DA-CALLER-v$VERSION-signature.txt" "DA-CALLER-v$VERSION-metadata.txt" \
            --target "$HEAD_SHA" --prerelease --title "DA CALLER v$VERSION (DEBUG TEST — UNVERIFIED)" \
            --notes-file preview-notes.md
